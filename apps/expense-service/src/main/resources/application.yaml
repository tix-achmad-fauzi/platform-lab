spring:
  application:
    name: expense-service
  datasource:
    # Overridable via SPRING_DATASOURCE_URL / SPRING_DATASOURCE_PASSWORD (relaxed binding)
    url: jdbc:postgresql://localhost:5432/expense
    username: expense
    password: expense
    hikari:
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
